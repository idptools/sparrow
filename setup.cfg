[coverage:run]
# .coveragerc to control coverage.py and pytest-cov
omit =
    # Omit the tests
    */tests/*
    # Omit generated versioningit
    metapredict/_version.py

# Style is owned by ruff, configured in pyproject.toml under [tool.ruff].
# The former [yapf] and [flake8] sections (both 119 columns) were removed when
# the ruff pre-commit hooks landed, so two tools can't disagree about format.

# means we can run python setup.py test to
# run tests... maybe...
[aliases]
test = pytest
