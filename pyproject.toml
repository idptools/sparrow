[build-system]

# sparrow is pure Python - no compiler, Cython or build-time numpy required
requires = ["setuptools>=61", "versioningit~=2.0"]
build-backend = "setuptools.build_meta"


# define project info
[project]
# The import name stays `sparrow`; only the distribution is namespaced, matching
# idptools-parrot / idptools-metapredict. Plain `sparrow` on PyPI belongs to an
# unrelated project, so it is not available to us.
name = "idptools-sparrow"
dynamic = ["version"]
description = "Next generation sequence analysis package for working with disordered regions and disordered proteins"
authors = [
    {name = "Alex Holehouse", email = "alex.holehouse@wustl.edu"}
]
license = {text = "CC-NC-ND"}
readme = "README.md"
requires-python = ">=3.10"

# add in as needed  
dependencies = [
    "numpy>=1.14.0",
    "scipy",
    "pandas",
    "protfasta",
    "metapredict>2",
    "ipython",
    # PyPI rather than a bare git URL: an unpinned git dependency resolves to a
    # different commit on every install, and predictors/network_loader.py infers
    # input size, layer count and hidden size from the state-dict key names PARROT
    # emits - so an upstream rename would silently break every predictor.
    "idptools-parrot>=1.7.5",
    # 0.4.2 widened the SAW P(r) grid to max(3*(7*nres**0.5), 4*Ree). Earlier
    # versions sized it from chain length alone, truncating the tail and biasing
    # the mean end-to-end distance low, worse as the prefactor grows. 0.4.2
    # requires Python >= 3.10, which is why sparrow does too.
    "afrc>=0.4.2",
    "tqdm",
    "pyfamsa",
]

[project.optional-dependencies]
test = [
  "pytest>=6.1.2",
  # test_sparrow_vs_localcider.py imports this at module scope, so without it
  # `pytest sparrow/tests` fails during *collection* and no tests run at all;
  # test_kappa.py also needs it. It is the suite's only external oracle.
  "localcider",
]
dev = [
  "sparrow[test]",
  "pre-commit",
]


[tool.setuptools]
zip-safe = false
include-package-data = true 

[tool.setuptools.packages.find]
namespaces = true
where = ["."]
include = ["sparrow", "sparrow.*"]  # Discover all sub-packages inside the main package

[tool.setuptools.package-data]
sparrow = [
    "py.typed",
    # shipped so the pointer in sparrow.nardini's docstring resolves for an
    # installed copy, not just a checkout
    "nardini/architecture.md",
]

# keep editor autosave/backup files out of the distributions. MANIFEST.in cannot
# express this: '#' starts a comment there, so a '#*#' pattern is unusable.
[tool.setuptools.exclude-package-data]
"*" = ["#*#", ".#*", "*~", "*.orig", "*.rej"]

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["*"]
default-tag = "1.0.0"

[tool.versioningit.write]
file = "sparrow/_version.py"

# ---------------------------------------------------------------------------
# Linting / formatting. Ruff replaces the flake8 and yapf settings that used to
# live in setup.cfg; 119 columns is carried over from those.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 119
# target-version is inferred from requires-python above - don't restate it.
extend-exclude = [
    "sparrow/_version.py",   # generated by versioningit
    "*.ipynb",               # executed, output-bearing worked examples
    # Ruff also formats ```python fences inside Markdown. The pre-commit hooks
    # never see .md (types_or: python/pyi/jupyter), but a bare `ruff format .`
    # would rewrite the hand-written samples in README.md and CHANGELOG.md.
    # Excluding here keeps the CLI and the hooks in agreement.
    "*.md",
]

[tool.ruff.lint]
# Ruff 0.16 turns on a far broader default set (~370 findings here). This is the
# classic pyflakes + pycodestyle-error core, so the gate stays stable across ruff
# upgrades. Widen it deliberately, not by accident.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# sparrow/__init__.py and sparrow/data/__init__.py re-export their public API.
"__init__.py" = ["F401"]

[tool.ty.src]
exclude = [
    # 67 diagnostics, all cross-cell name resolution rather than real type errors.
    "**/*.ipynb",
]

# protfasta.read_fasta is annotated Union[dict[str, str], list[list[str]]] rather
# than overloaded on its return_list flag, so a type checker cannot narrow it, and
# every seqs[key] / .items() / .keys() on the result reports. That accounted for 184
# of ty's original 229 diagnostics (test_albatross.py alone had 136). Scoping those
# two rules off for the test tree - rather than excluding the tree outright - keeps
# tests checked for everything else, so a genuinely new class of error there still
# surfaces. It also leaves the undeclared-localcider imports visible.
[[tool.ty.overrides]]
include = ["sparrow/tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
