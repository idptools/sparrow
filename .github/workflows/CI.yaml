name: CI

on:
  # GitHub has started calling new repo's first branch "main" https://github.com/github/renaming
  # Existing codes likely still have "master" as the primary branch
  # Both are tracked here to keep legacy and new codes working
  push:
    branches:
      - "master"
      - "main"
  pull_request:
    branches:
      - "master"
      - "main"
  schedule:
    # Nightly tests run on master by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * *"

jobs:
  # Fast, deterministic checks. Deliberately one OS and one Python rather than the
  # test matrix: ruff's result does not vary by platform, and running it twelve
  # times would only slow the feedback down.
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # the ty hook shells out to `uvx`, so uv has to be on PATH
    - uses: astral-sh/setup-uv@v5

    - name: Install pre-commit
      run: python -m pip install --upgrade pip pre-commit

    # ruff check + ruff format at the versions pinned in .pre-commit-config.yaml,
    # so CI and a local `pre-commit run --all-files` cannot drift apart
    - name: Run ruff
      run: pre-commit run --all-files --show-diff-on-failure

    # ty must run against a populated environment. With dependencies missing, their
    # imports resolve to Unknown and genuine type errors stop being reported rather
    # than being flagged -- the run would pass while checking almost nothing.
    #
    # The constraints file pins that environment to a set the suite and ty are known
    # to pass against, so a new numpy or pandas cannot turn this job red on an
    # unrelated PR. The `test` matrix below deliberately stays unpinned, and the
    # nightly schedule runs it, so upstream breakage still gets found -- just not in
    # the middle of someone's review.
    - name: Install sparrow and its test dependencies (pinned)
      run: python -m pip install -e '.[test]' -c devtools/ci-constraints-py312.txt

    - name: Run ty
      run: pre-commit run ty --hook-stage manual --all-files

  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    # Codecov uploads via OIDC rather than a shared upload token, which needs
    # id-token: write. Naming permissions explicitly also narrows the job's token
    # to just these two.
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        os: [macOS-latest, ubuntu-latest, windows-latest]
        # must stay consistent with requires-python in pyproject.toml (>=3.10)
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Additional info about the build
      shell: bash
      run: |
        uname -a
        df -h
        ulimit -a


    # More info on options: https://github.com/conda-incubator/setup-miniconda
    - uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: ${{ matrix.python-version }}
        environment-file: devtools/conda-envs/test_env.yaml

        channels: conda-forge,defaults

        activate-environment: test
        auto-update-conda: false
        auto-activate-base: false
        show-channel-urls: true

    - name: Install package

      # conda setup requires this special shell
      shell: bash -l {0}
      run: |
        # sparrow is pure Python - no compiler or build-time extensions needed
        python -m pip install .
        conda list


    - name: Run tests

      # conda setup requires this special shell
      shell: bash -l {0}

      run: |
        pytest -v --cov=sparrow --cov-report=xml --color=yes sparrow/tests/

    # v1 used the retired uploader, so this step had become a silent no-op. Note the
    # input is `files` (plural) in v4+ -- the old `file` is gone and would be ignored.
    # use_oidc avoids a repository upload token entirely, which matters because fork
    # PRs cannot read repository secrets and most contributions here arrive from
    # forks. A failed coverage upload should not fail a build whose tests passed.
    - name: CodeCov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        use_oidc: true
      continue-on-error: true
