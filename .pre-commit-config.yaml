# Install the git hook once:   pre-commit install
# Check the whole repo:        pre-commit run --all-files
#
# Rule selection, line length and exclusions all live in pyproject.toml under
# [tool.ruff] / [tool.ty.src], so the CLI and these hooks agree by construction.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ty runs as a LOCAL hook rather than via astral-sh/ty-pre-commit, whose entry
  # point is `uv check`. That type-checks against the project .venv, which on this
  # repo is worse in three ways no amount of hook config fixes:
  #
  #   1. `uv check` accepts no path argument, so it checks the whole tree --
  #      benchmarks/, devtools/, and inside .venv/ itself.
  #   2. It syncs only [project] dependencies, not extras, so every `import pytest`
  #      in the suite reports unresolved-import (26 of them).
  #   3. It needs an ~844 MB second environment (torch included) kept in step with
  #      the conda env sparrow is actually run from -- and then checks the copy
  #      rather than the one you use.
  #
  # Measured on this repo: packaged hook 79 diagnostics, this hook 2.
  #
  # This form resolves whichever environment is active (conda, venv, whatever).
  # Requires `uv` on PATH -- uvx fetches ty into ~/.cache/uv on first run; note that
  # uv does NOT bundle ty. The version is pinned so the count cannot drift with
  # upstream releases; bump it deliberately.
  #
  # It stays on the `manual` stage because ty checks the whole project on every run
  # regardless of what you touched:
  #
  #     pre-commit run ty --hook-stage manual
  #
  # Drop `stages: [manual]` to make it a commit gate. Two diagnostics remain, both
  # the genuinely-undeclared localcider test dependency.
  - repo: local
    hooks:
      - id: ty
        name: ty (active environment)
        entry: uvx ty@0.0.73 check sparrow/
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
